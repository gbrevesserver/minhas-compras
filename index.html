<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ee4d2d"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><title>Minhas Compras</title></head><body><main><header><h1>🛍️ Minhas Compras</h1><p>Seu controle de gastos</p></header><section class="total"><small>Total registrado</small><strong id="total">R$ 0,00</strong></section><section><h2>Nova compra</h2><form id="form"><label>Loja<select id="loja" required><option>Shopee</option><option>Amazon</option><option>Mercado Livre</option><option>AliExpress</option><option>Shein</option><option>Supermercado</option><option>Outras</option></select></label><label>Produto<input id="produto" required maxlength="120" placeholder="O que você comprou?"></label><label>Valor (R$)<input id="valor" type="number" required min="0.01" step="0.01" inputmode="decimal" placeholder="0,00"></label><label>Data<input id="data" type="date" required></label><button type="submit">+ Salvar compra</button></form></section><section><h2>Gastos por loja</h2><div id="lojas"></div></section><section><h2>Histórico</h2><div id="historico"></div></section><section class="backup"><h2>Backup</h2><button id="exportar" type="button">Exportar compras (JSON)</button><label class="importar">Importar backup<input type="file" id="importar" accept="application/json,.json"></label><p>Seus dados ficam neste navegador. Faça backups regularmente: limpar dados do navegador ou desinstalar o app pode apagá-los.</p></section></main><script src="app.js" defer></script></body></html>
